<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <header class="page-header">
            <h1>Employee Management System</h1>
            <p>Manage employee records easily</p>
        </header>

        <div class="message success" th:if="${successMessage}" th:text="${successMessage}"></div>

        <div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <section class="panel">
            <h2>Add New Employee</h2>

            <form th:action="@{/employees}" th:object="${employee}" method="post" novalidate>

                <div class="form-grid">

                    <div class="field">
                        <label for="fullName">Full Name</label>
                        <input id="fullName" type="text" th:field="*{fullName}">

                        <small class="field-error" th:errors="*{fullName}"></small>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" type="email" th:field="*{email}">

                        <small class="field-error" th:errors="*{email}"></small>
                    </div>

                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input id="phone" type="tel" th:field="*{phone}" maxlength="10">

                        <small class="field-error" th:errors="*{phone}"></small>
                    </div>

                    <div class="field">
                        <label for="department">Department</label>
                        <input id="department" type="text" th:field="*{department}">

                        <small class="field-error" th:errors="*{department}"></small>
                    </div>

                    <div class="field">
                        <label for="salary">Salary</label>
                        <input id="salary" type="number" th:field="*{salary}" step="0.01">

                        <small class="field-error" th:errors="*{salary}"></small>
                    </div>

                </div>

                <button type="submit" class="btn primary">
                    Save Employee
                </button>
            </form>
        </section>

        <section class="panel">
            <div class="table-header">
                <h2>Employee Records</h2>

                <form th:action="@{/employees}" method="get" class="search-form">
                    <input type="search" name="keyword" placeholder="Search by name" th:value="${keyword}">
                    <button type="submit" class="btn primary">
                        Search
                    </button>
                    <a th:href="@{/employees}" class="btn secondary">
                        Clear
                    </a>
                </form>
            </div>

            <p th:if="${#lists.isEmpty(employees)}" class="empty-message">
                No employees found.
            </p>

            <div class="table-wrapper" th:unless="${#lists.isEmpty(employees)}">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="emp : ${employees}">
                            <td th:text="${emp.id}"></td>
                            <td th:text="${emp.fullName}"></td>
                            <td th:text="${emp.email}"></td>
                            <td th:text="${emp.phone}"></td>
                            <td th:text="${emp.department}"></td>
                            <td th:text="${emp.salary}"></td>
                            <td class="actions">
                                <a class="btn edit" th:href="@{/employees/{id}/edit(id=${emp.id})}">
                                    Edit
                                </a>

                                <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post"
                                    onsubmit="return confirm('Delete this employee?');">
                                    <button type="submit" class="btn delete">
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p class="record-count">
                Total employees displayed:
                <strong th:text="${#lists.size(employees)}">0</strong>
            </p>
        </section>
    </div>
</body>

</html>
