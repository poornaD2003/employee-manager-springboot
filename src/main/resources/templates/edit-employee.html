<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <section class="panel">
        <h1>Edit Employee</h1>
        <p>Update the employee details below.</p>

        <form th:action="@{/employees/{id}/update(id=${employee.id})}"
              th:object="${employee}" method="post">

            <div class="form-grid">
                <div class="field">
                    <label for="fullName">Full Name</label>
                    <input id="fullName" type="text"
                           th:field="*{fullName}" required>
                    <small class="field-error"
                           th:errors="*{fullName}"></small>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email"
                           th:field="*{email}" required>
                    <small class="field-error"
                           th:errors="*{email}"></small>
                </div>

                <div class="field">
                    <label for="phone">Phone Number</label>
                    <input id="phone" type="tel"
                           th:field="*{phone}"
                           pattern="[0-9]{10}"
                           maxlength="10" required>
                    <small class="field-error"
                           th:errors="*{phone}"></small>
                </div>

                <div class="field">
                    <label for="department">Department</label>
                    <input id="department" type="text"
                           th:field="*{department}" required>
                    <small class="field-error"
                           th:errors="*{department}"></small>
                </div>

                <div class="field">
                    <label for="salary">Salary</label>
                    <input id="salary" type="number"
                           th:field="*{salary}"
                           min="0.01" step="0.01" required>
                    <small class="field-error"
                           th:errors="*{salary}"></small>
                </div>
            </div>

            <button type="submit" class="btn primary">
                Update Employee
            </button>

            <a th:href="@{/employees}" class="btn secondary">
                Cancel
            </a>
        </form>
    </section>
</div>
</body>
</html>
